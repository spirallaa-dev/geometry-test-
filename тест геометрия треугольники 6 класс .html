<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по геометрии: Треугольники (6 класс)</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --danger: #e71d36;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2b2d42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .question-block {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid var(--primary);
            transition: all 0.3s ease;
        }

        .question-block.correct {
            border-left-color: var(--success);
            background: #e8f8f5;
        }

        .question-block.wrong {
            border-left-color: var(--danger);
            background: #fdedee;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .options label {
            display: block;
            padding: 10px 15px;
            margin: 8px 0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .options label:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        .options input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            background: #3a0ca3;
        }

        .btn-restart {
            background: #6c757d;
        }
        
        .btn-restart:hover {
            background: #5a6268;
        }

        .result-box {
            display: none;
            text-align: center;
            padding: 30px;
            margin-top: 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
        }

        .result-box h2 {
            margin: 0 0 10px 0;
            font-size: 32px;
        }

        .result-box p {
            font-size: 18px;
            margin: 5px 0;
        }

        .grade {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .hint {
            color: #d00000;
            font-size: 14px;
            margin-top: 10px;
            font-style: italic;
            display: none;
        }
        
        .question-block.wrong .hint {
            display: block;
        }

        input:disabled, label.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📐 Тест: Треугольники</h1>
        <p class="subtitle">Математика, 6 класс. В тесте 10 вопросов. Удачи!</p>
    </header>

    <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="button" class="btn" id="checkBtn" onclick="checkAnswers()">Проверить результаты</button>
    </form>

    <div class="result-box" id="resultBox">
        <h2>Тест завершен!</h2>
        <div class="grade" id="gradeText"></div>
        <p id="scoreText"></p>
        <p id="commentText"></p>
        <button type="button" class="btn btn-restart" onclick="restartQuiz()">Пройти заново</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Чему равна сумма углов любого треугольника?",
            opts: ["90°", "180°", "360°", "Зависит от треугольника"],
            correct: 1
        },
        {
            q: "Как называется треугольник, у которого все три стороны равны?",
            opts: ["Равнобедренным", "Прямоугольным", "Равносторонним", "Разносторонним"],
            correct: 2
        },
        {
            q: "Можно ли построить треугольник со сторонами 3 см, 4 см и 8 см?",
            opts: ["Да, это прямоугольный треугольник", "Нет, так как 3 + 4 < 8", "Да, это остроугольный треугольник", "Нет, так как у него должно быть 4 стороны"],
            correct: 1
        },
        {
            q: "В треугольнике два угла равны 40° и 60°. Чему равен третий угол?",
            opts: ["100°", "80°", "90°", "120°"],
            correct: 1
        },
        {
            q: "Как называется сторона прямоугольного треугольника, лежащая напротив угла в 90°?",
            opts: ["Биссектриса", "Медиана", "Катет", "Гипотенуза"],
            correct: 3
        },
        {
            q: "Если один из углов треугольника равен 110°, то треугольник называется...",
            opts: ["Остроугольным", "Прямоугольным", "Тупоугольным", "Разносторонним"],
            correct: 2
        },
        {
            q: "Периметр равностороннего треугольника равен 21 см. Чему равна его сторона?",
            opts: ["3 см", "5 см", "7 см", "9 см"],
            correct: 2
        },
        {
            q: "Может ли в треугольнике быть два тупых угла?",
            opts: ["Да, если это равнобедренный треугольник", "Нет, так как сумма углов превысит 180°", "Да, но только у прямоугольного", "Нет, тупой угол бывает только один и у четырехугольника"],
            correct: 1
        },
        {
            q: "Как называется отрезок, соединяющий вершину треугольника с серединой противоположной стороны?",
            opts: ["Биссектриса", "Высота", "Медиана", "Периметр"],
            correct: 2
        },
        {
            q: "В равнобедренном треугольнике угол при вершине (между боковыми сторонами) равен 40°. Чему равны углы при основании?",
            opts: ["40° и 40°", "70° и 70°", "90° и 50°", "140° и 140°"],
            correct: 1
        }
    ];

    const quizContainer = document.getElementById('quizContainer');
    const resultBox = document.getElementById('resultBox');
    const checkBtn = document.getElementById('checkBtn');

    function renderQuiz() {
        quizContainer.innerHTML = '';
        questions.forEach((q, index) => {
            let html = `
                <div class="question-block" id="qBlock${index}">
                    <div class="question-text">${index + 1}. ${q.q}</div>
                    <div class="options">
            `;
            q.opts.forEach((opt, optIndex) => {
                html += `
                    <label id="label_${index}_${optIndex}">
                        <input type="radio" name="q${index}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });
            html += `
                    </div>
                    <div class="hint" id="hint${index}"></div>
                </div>
            `;
            quizContainer.innerHTML += html;
        });
    }

    function checkAnswers() {
        let score = 0;
        
        questions.forEach((q, index) => {
            const block = document.getElementById(`qBlock${index}`);
            const hint = document.getElementById(`hint${index}`);
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            
            // Сброс классов
            block.classList.remove('correct', 'wrong');
            
            if (selected) {
                const userAnswer = parseInt(selected.value);
                if (userAnswer === q.correct) {
                    score++;
                    block.classList.add('correct');
                } else {
                    block.classList.add('wrong');
                    hint.innerText = `Правильный ответ: ${q.opts[q.correct]}`;
                }
            } else {
                block.classList.add('wrong');
                hint.innerText = `Вы пропустили вопрос. Правильный ответ: ${q.opts[q.correct]}`;
            }

            // Блокируем ввод
            const inputs = document.querySelectorAll(`input[name="q${index}"]`);
            inputs.forEach(inp => inp.disabled = true);
        });

        showResults(score);
    }

    function showResults(score) {
        checkBtn.style.display = 'none';
        resultBox.style.display = 'block';
        
        const scoreText = document.getElementById('scoreText');
        const gradeText = document.getElementById('gradeText');
        const commentText = document.getElementById('commentText');

        scoreText.innerText = `Вы правильно ответили на ${score} из ${questions.length} вопросов.`;

        let grade = '';
        let comment = '';

        if (score === 10) {
            grade = '5+ (Отлично!)';
            comment = 'Превосходно! Ты настоящий знаток геометрии! 🏆';
        } else if (score >= 8) {
            grade = '5 (Отлично)';
            comment = 'Отличный результат! Ты очень хорошо усвоил тему.';
        } else if (score >= 6) {
            grade = '4 (Хорошо)';
            comment = 'Хороший результат, но есть над чем подумать.';
        } else if (score >= 4) {
            grade = '3 (Удовлетворительно)';
            comment = 'Базовые знания есть, но нужно повторить виды треугольников и их свойства.';
        } else {
            grade = '2 (Нужно повторить)';
            comment = 'Не расстраивайся! Перечитай параграф о треугольниках и попробуй еще раз.';
        }

        gradeText.innerText = grade;
        commentText.innerText = comment;
        
        // Плавная прокрутка к результатам
        resultBox.scrollIntoView({ behavior: 'smooth' });
    }

    function restartQuiz() {
        resultBox.style.display = 'none';
        checkBtn.style.display = 'block';
        renderQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Инициализация теста при загрузке страницы
    renderQuiz();
</script>

</body>
</html>
